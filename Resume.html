<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Resume · Priyanka Lakkad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #060607; color: #fff; font-family: 'Geist', -apple-system, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    background-image:
      radial-gradient(65vw 62vh at 4% -8%, rgba(139,92,246,0.30) 0%, rgba(139,92,246,0.14) 42%, rgba(139,92,246,0.04) 70%, rgba(139,92,246,0) 100%),
      radial-gradient(58vw 55vh at 100% 6%, rgba(99,102,241,0.26) 0%, rgba(99,102,241,0.12) 44%, rgba(99,102,241,0.03) 72%, rgba(99,102,241,0) 100%),
      radial-gradient(70vw 50vh at 22% 46%, rgba(124,58,237,0.16) 0%, rgba(124,58,237,0.07) 45%, rgba(124,58,237,0.02) 74%, rgba(124,58,237,0) 100%);
    background-attachment: fixed; background-repeat: no-repeat;
  }
  a { color: #8B5CF6; text-decoration: none; }
  a:hover { color: #a78bfa; }

  nav { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; max-width: 1440px; margin: 0 auto; width: 100%; padding: 24px 120px; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 1.75px solid rgba(167,139,250,0.55); box-shadow: 0 0 14px rgba(139,92,246,0.18);
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; flex-shrink: 0;
  }
  .logo-mark span { background-image: linear-gradient(135deg, #d8c9fc, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; padding-left: 0.05em; }
  .logo-name { font-weight: 600; font-size: 16px; color: #fff; letter-spacing: -0.01em; }
  .nav-links { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 36px; margin-left: auto; }
  .nav-links a { font-size: 14px; color: rgba(255,255,255,0.75); transition: color 180ms ease-out; }
  .nav-links a.active { color: #a78bfa; }

  main { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; padding: 64px 24px 96px; }
  h1 { font-size: clamp(32px, 4vw, 44px); font-weight: 700; letter-spacing: -0.015em; margin: 0 0 12px; }
  .subhead { font-size: 16px; color: rgba(255,255,255,0.5); margin: 0 0 40px; text-align: center; max-width: 480px; }

  .resume-frame {
    position: relative; width: 100%; max-width: 620px; aspect-ratio: 8.5 / 11;
    border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    border: 1px solid rgba(139,92,246,0.22); background: #0a0810;
  }
  .resume-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  footer { border-top: 1px solid rgba(255,255,255,0.08); margin-top: auto; }
  .footer-inner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; max-width: 1440px; margin: 0 auto; width: 100%; padding: 28px 120px; }
  .footer-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .footer-nav { display: flex; flex-wrap: wrap; gap: 28px; }
  .footer-nav a { font-size: 13px; color: rgba(255,255,255,0.6); }
  .copyright { font-size: 13px; color: rgba(255,255,255,0.4); }

  @media (max-width: 900px) {
    .nav-inner { padding: 20px 24px; }
    .footer-inner { padding: 24px 24px; }
  }
  @media (max-width: 640px) {
    .nav-links { gap: 20px; }
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="logo" href="/">
        <span class="logo-mark"><span>PL</span></span>
        <span class="logo-name">Priyanka Lakkad</span>
      </a>
      <div class="nav-links">
        <a href="/">Work</a>
        <a href="About.dc.html">About</a>
        <a class="active" href="Resume.html">Resume</a>
        <a href="Contact.dc.html">Contact</a>
      </div>
    </div>
  </nav>

  <main>
    <h1>Resume</h1>
    <p class="subhead">A snapshot of my experience, skills, and background.</p>
    <div class="resume-frame">
      <img src="assets/resume-preview.png" alt="Resume preview">
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-left">
        <a class="logo-mark" href="/"><span>PL</span></a>
        <span class="copyright">© 2026 Priyanka Lakkad</span>
      </div>
      <div class="footer-nav">
        <a href="/">Work</a>
        <a href="About.dc.html">About</a>
        <a href="Resume.html">Resume</a>
        <a href="Contact.dc.html">Contact</a>
      </div>
    </div>
  </footer>

</body>
</html>
